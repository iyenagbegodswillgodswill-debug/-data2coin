<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | Data2Coin Ghana</title>

<style>

body {

    margin: 0;

    padding: 20px;

    font-family: Arial, sans-serif;

    background: #111;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 90vh;

}

.container {

    background: #202020;

    padding: 30px 22px;

    border-radius: 14px;

    width: 100%;

    max-width: 380px;

    box-sizing: border-box;

}

h2 {

    color: #ffcc00;

    text-align: center;

}

p {

    color: #ccc;

    text-align: center;

}

input {

    width: 100%;

    padding: 14px;

    margin: 10px 0;

    box-sizing: border-box;

    border-radius: 7px;

    border: 1px solid #555;

    background: #333;

    color: white;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    background: #ffcc00;

    color: black;

    border: none;

    border-radius: 7px;

    font-weight: bold;

    font-size: 16px;

}

#message {

    margin-top: 15px;

    text-align: center;

    overflow-wrap: anywhere;

}

</style>

</head>

<body>

<div class="container">

<h2>Data2Coin Ghana</h2>

<p>Create your new seller password.</p>

<form id="resetForm">

<input

type="password"

id="password"

placeholder="New password"

minlength="8"

required

>

<input

type="password"

id="confirmPassword"

placeholder="Confirm new password"

minlength="8"

required

>

<button type="submit" id="saveButton">

Save New Password

</button>

</form>

<div id="message">

Checking your recovery link...

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =

"https://lulbwtfxavlddcemyfyx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =

"sb_publishable_-jijVrjmTRU_HJDX33euyw_y89CrW7j";

const db = supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

);

const form = document.getElementById("resetForm");

const message = document.getElementById("message");

const button = document.getElementById("saveButton");

form.style.display = "none";

async function checkRecoverySession() {

    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {

        message.textContent =

        "Your recovery link is invalid or expired. Please request a new password reset email.";

        return;

    }

    form.style.display = "block";

    message.textContent =

    "Recovery link verified. Enter your new password.";

}

checkRecoverySession();

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =

    document.getElementById("password").value;

    const confirmPassword =

    document.getElementById("confirmPassword").value;

    if (password.length < 8) {

        message.textContent =

        "Password must contain at least 8 characters.";

        return;

    }

    if (password !== confirmPassword) {

        message.textContent =

        "Your passwords do not match.";

        return;

    }

    button.disabled = true;

    button.textContent = "Saving...";

    const { error } = await db.auth.updateUser({

        password: password

    });

    if (error) {

        message.textContent = error.message;

        button.disabled = false;

        button.textContent = "Save New Password";

        return;

    }

    message.textContent =

    "Password updated successfully! You can now log in to Data2Coin.";

    form.style.display = "none";

});

</script>

</body>

</html>
