<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Reset | Data2Coin Ghana</title>
<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
}
.container {
    background: #202020;
    padding: 30px 22px;
    border-radius: 14px;
    width: 100%;
    max-width: 380px;
    box-sizing: border-box;
}
h2 {
    color: #ffcc00;
    text-align: center;
}
p {
    color: #ccc;
    text-align: center;
}
input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    box-sizing: border-box;
    border-radius: 7px;
    border: 1px solid #555;
    background: #333;
    color: white;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    background: #ffcc00;
    color: black;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    font-size: 16px;
}
button:disabled {
    opacity: 0.6;
}
#message {
    margin-top: 15px;
    text-align: center;
    overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="container">
<h2>Data2Coin Ghana</h2>
<p>Secure your seller account.</p>
<div id="requestSection">
    <p>Request a password-reset email.</p>
    <input type="email" id="email" placeholder="Your account email" required>
    <button id="requestButton">Send Reset Email</button>
</div>
<form id="resetForm" style="display:none;">
    <p>Enter your new password.</p>
    <input type="password" id="password" placeholder="New password" minlength="8" required>
    <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8" required>
    <button type="submit" id="saveButton">Save New Password</button>
</form>
<div id="message">Checking your account...</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
"https://lulbwtfxavlddcemyfyx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_-jijVrjmTRU_HJDX33euyw_y89CrW7j";
const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);
const resetPage =
"https://iyenagbegodswillsgodswill-debug.github.io/-data2coin/reset-password.html";
const requestSection =
document.getElementById("requestSection");
const resetForm =
document.getElementById("resetForm");
const message =
document.getElementById("message");
async function checkRecoverySession() {
    const { data, error } = await db.auth.getSession();
    if (error) {
        message.textContent = error.message;
        return;
    }
    if (data.session) {
        requestSection.style.display = "none";
        resetForm.style.display = "block";
        message.textContent =
        "Recovery link verified. Enter your new password.";
    } else {
        requestSection.style.display = "block";
        resetForm.style.display = "none";
        message.textContent =
        "Enter your email to receive a password-reset link.";
    }
}
document.getElementById("requestButton")
.addEventListener("click", async function() {
    const email =
    document.getElementById("email").value.trim();
    if (!email) {
        message.textContent = "Please enter your email.";
        return;
    }
    this.disabled = true;
    this.textContent = "Sending...";
    const { error } = await db.auth.resetPasswordForEmail(
        email,
        { redirectTo: resetPage }
    );
    this.disabled = false;
    this.textContent = "Send Reset Email";
    if (error) {
        message.textContent = error.message;
    } else {
        message.textContent =
        "If the account exists, a password-reset email has been sent. Check your inbox.";
    }
});
resetForm.addEventListener("submit", async function(event) {
    event.preventDefault();
    const password =
    document.getElementById("password").value;
    const confirmPassword =
    document.getElementById("confirmPassword").value;
    if (password.length < 8) {
        message.textContent =
        "Password must contain at least 8 characters.";
        return;
    }
    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }
    const button =
    document.getElementById("saveButton");
    button.disabled = true;
    button.textContent = "Saving...";
    const { error } = await db.auth.updateUser({
        password: password
    });
    button.disabled = false;
    button.textContent = "Save New Password";
    if (error) {
        message.textContent = error.message;
        return;
    }
    resetForm.style.display = "none";
    message.textContent =
    "Password updated successfully! Your seller password is ready.";
});
checkRecoverySession();
</script>
</body>
</html>
